name: Sync NEMSU public information

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nemsu-public-information-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync public NEMSU posts and pages into the dataset
        env:
          SYNC_URL: ${{ secrets.NEMSU_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.NEMSU_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            echo "Configure NEMSU_SYNC_URL and NEMSU_SYNC_TOKEN in repository Actions secrets."
            exit 1
          fi
          # Render may briefly return 502 while a sleeping service starts or a deploy settles.
          # Retry transient transport and HTTP errors; permanent failures still fail the job.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 30 --max-time 1700 \
            --retry 5 --retry-all-errors --retry-delay 20 --retry-max-time 600 \
            --request POST \
            --header "X-Sync-Token: $SYNC_TOKEN" \
            "$SYNC_URL"

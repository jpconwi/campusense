name: Build NEMSAI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["nemsai_mobile/nemsai_app/**"]

defaults:
  run:
    working-directory: nemsai_mobile/nemsai_app

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.27.4", channel: stable, cache: true }
      - name: Generate android/ and apply settings
        run: bash scripts/setup_android.sh
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Sign with the app key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p dist
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No keystore secret"; cp $APK dist/NEMSAI.apk; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out dist/NEMSAI.apk $APK
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: NEMSAI-apk
          path: nemsai_mobile/nemsai_app/dist/NEMSAI.apk
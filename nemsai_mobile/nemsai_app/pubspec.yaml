name: nemsai
description: NEMSAI - NEMSU Tandag Main Campus Assistant (student and instructor app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ">=5.7.0 <5.8.0"       # 5.7.x uses http_parser's MediaType (5.8+ renamed it)
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2       # 6.x API (serverClientId + idToken)
  camera: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#17119E"
  adaptive_icon_foreground: "assets/logo.png"
